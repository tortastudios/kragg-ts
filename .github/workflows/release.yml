name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege by default. The publish job below grants only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build / test / publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # id-token: write is what lets npm attach provenance to the published
    # package. contents: write is what lets this job create the GitHub
    # release. Nothing else in this workflow needs either.
    permissions:
      contents: write
      id-token: write

    env:
      npm_config_ignore_scripts: "true"

    steps:
      # See ci.yml for why every `uses:` here is pinned to a full commit SHA
      # instead of a tag.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Local conformance fixtures
        run: pnpm run conformance

      # The pushed tag is the source of truth for what gets published. A tag
      # that does not match package.json#version means a step was skipped.
      - name: Check the tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
