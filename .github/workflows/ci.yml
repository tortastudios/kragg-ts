name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. Nothing here needs to write to the repo.
permissions:
  contents: read

# A superseded run tells you nothing useful. Cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Dependency lifecycle scripts must not run anywhere in this job.
    # See docs/dependency-policy.md.
    env:
      npm_config_ignore_scripts: "true"

    steps:
      # EVERY `uses:` IN THIS FILE IS PINNED TO A FULL COMMIT SHA. Do not
      # replace one with a tag, not even a patch tag.
      #
      # A tag — `@v5`, `@v5.0.1`, any of them — is a mutable pointer owned by
      # the action's maintainer. Repointing it is a normal git operation, so a
      # tag is a standing authorization to run whatever that account publishes
      # next, with this repository checked out and this job's token in scope.
      # That is the same exposure `pnpm-workspace.yaml` spends `ignoreScripts`
      # and a 30-day `minimumReleaseAge` defending against for npm; CI runs on
      # every push, so leaving it open here would undo the rest.
      #
      # To update one: resolve the tag to its commit and paste the SHA.
      #   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
      # If that prints `"type": "tag"` rather than `"type": "commit"`, it is
      # an annotated tag and the SHA is the tag object, NOT the commit —
      # dereference it before pinning:
      #   gh api repos/<owner>/<repo>/git/tags/<sha> --jq '.object.sha'
      # Then confirm the SHA is real before committing it:
      #   gh api repos/<owner>/<repo>/commits/<sha> --jq .sha
      # Never hand-write a SHA. A wrong-but-plausible one is worse than a tag.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Reads packageManager from package.json, so the pinned pnpm version
      # and its integrity hash are the single source of truth.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # --frozen-lockfile: fail if package.json and the lockfile disagree,
      #   rather than silently resolving something new in CI.
      # --ignore-scripts: belt and braces. `ignoreScripts: true` in
      #   pnpm-workspace.yaml already covers this; the flag makes the
      #   guarantee visible at the call site and survives a config edit.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fail loudly if anything ever gets added to the build allowlist.
      # `allowBuilds` must remain empty; see docs/dependency-policy.md.
      - name: Assert no dependency is allowed to run build scripts
        run: |
          if grep -Eq '^allowBuilds:[[:space:]]*\{\}[[:space:]]*$' pnpm-workspace.yaml; then
            echo "OK: allowBuilds is empty"
          else
            echo "::error::allowBuilds is no longer empty. This re-enables"
            echo "::error::arbitrary code execution at install time."
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # TODO(spec): add a conformance job once `tortastudios/crag` grows its
  # `spec/` directory. It must clone that repo at a PINNED spec tag — never
  # `main` — run `spec/fixtures/` through this implementation, and diff the
  # JSON output. See docs/spec-conformance.md.
